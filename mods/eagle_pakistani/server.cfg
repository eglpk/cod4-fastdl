// ==========================================
// EAglE PAKISTANI HUNTER - COD4X SERVER
// Based on Promod Live v2 configuration
// ==========================================

// SERVER IDENTITY
set sv_hostname "^2EAglE ^7PaKisTani ^1HunTer"
sets _Admin "Eagle"
sets _Website "EAglE Gaming Zone"
sets _Email ""
sets _TeamSpeak3 ""
sets _Location "PAKISTAN"
sets _Mod "EAglE CUSTOM COD4"
sets _ModVer "v1.0"
sets _ModUpdate "Yes"
sets _Maps "COD4 Stock"
sets _Type "Search and Destroy"

// WELCOME MESSAGE
seta scr_motd "^2Welcome To ^1EAglE ^7PaKisTani ^1HunTer"

// LOG SETTINGS
set g_logsync "2"
set logfile "1"
set g_log "eagle_mp.log"
set sv_log_damage "1"

// SERVER SETTINGS
set sv_authorizemode "0"
set g_disabledefcmdprefix "1"
set sv_gamespy "1"

// SECURITY
// Apna naya RCON password yahan lagayein
set rcon_password "CHANGE_YOUR_RCON_PASSWORD"

// SERVER AUTH TOKEN (Added)
set sv_authtoken "4597D885BCA01919EBD3C9F5C4D3F148BCC97A6D"

// SCREENSHOT PLUGIN
// Apni nayi identkey aur valid URL lagayein
seta nehoscreenshot_identkey "CHANGE_YOUR_IDENTKEY"
set nehoscreenshot_url "YOUR_SCREENSHOT_SUBMIT_URL"
loadplugin nehoscreenshotuploader

// PLUGINS - DLL FILES AVAILABLE HONE CHAHIYE
//loadplugin libcod4x_http_plugin
loadplugin censor

// B3 HIDE
set b3Hide "1"
set b3Prefix "!"
set b3HideLvl "20"
loadplugin b3hide

// CONSOLE MESSAGES
seta sv_consayname "^2[EAglE]^7"
seta sv_contellname "^2[EAglE][^5PM^2]^7>"

// MASTER SERVERS
set sv_master1 "cod4master.activision.com"
set sv_master2 "cod4master.cod4x.ovh"

// PLAYER SLOTS
set sv_maxclients "16"
set sv_privateclients "0"

// VOICE SETTINGS
set sv_voice "1"
set sv_voiceQuality "3"
set voice_deadChat "1"
set voice_global "1"
set voice_localEcho "0"
set winvoice_mic_mute "1"

// DOWNLOAD SETTINGS
set sv_allowdownload "1"
seta sv_wwwDownload "1"
set sv_wwwBaseURL "https://bestshop955-lab.github.io/cod4-fastdl"
set sv_wwwDlDisconnected "0"

// GAME MODE
set g_gametype "sd"

// MAP ROTATION
set sv_maprotationcurrent ""
set sv_mapRotation "map mp_backlot map mp_citystreets map mp_crash map mp_crossfire map mp_strike"

// PROMOD SETTINGS
set promod_mode "custom_public"
set promod_enable_scorebot "0"

// ANTI FLOOD
set sv_floodProtect "1"
set sv_reconnectlimit "3"
set g_no_script_spam "1"

// TEMP BAN
set sv_kickBanTime "60"
set scr_teambalance "1"

// LANGUAGE
seta loc_forceEnglish "0"
seta loc_language "0"
seta loc_translate "1"
seta loc_warnings "0"
seta loc_warningsAsErrors "0"

// SERVER STATUS
seta sv_running "1"

// ==========================================
// EAglE CUSTOM SETTINGS
// ==========================================

seta scr_mapsize "64"